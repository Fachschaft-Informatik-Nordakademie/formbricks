name: FSINF AGPL check

# Typecheck + unit tests for the AGPL-only rebuild branches (no ee/ code).
# Runs in CI because claudia cannot run tsc/next build without an OOM freeze.
on:
  push:
    branches: [agpl-only, "agpl-only-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsinf-agpl-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-ee-code:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail if Enterprise Edition code or imports are present
        run: |
          set -e
          if [ -e apps/web/modules/ee ]; then echo "apps/web/modules/ee must not exist"; exit 1; fi
          if grep -rnE "(from|import\(|mock\()[[:space:]]*\"[^\"]*modules/ee(/|\")" apps packages --include=*.ts --include=*.tsx --include=*.mjs --include=*.js --exclude-dir=node_modules; then
            echo "Found references to modules/ee"; exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64
      - run: pnpm dev:setup
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64
      - run: pnpm dev:setup
      - run: sed -i "s|REDIS_URL=.*|REDIS_URL=|" .env
      - run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
