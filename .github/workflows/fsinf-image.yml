name: FSINF image

on:
  push:
    branches: [main, agpl-only]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # no build secrets: apps/web/scripts/docker/read-secrets.sh falls back to placeholders;
      # gitops apps/formbricks pins the digest of :main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/fachschaft-informatik-nordakademie/formbricks:${{ github.sha }}
            ghcr.io/fachschaft-informatik-nordakademie/formbricks:${{ github.ref_name }}
